<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spedizione · tre colonne, al buio</title>
<link rel="stylesheet" href="mondo.css">
<link rel="stylesheet" href="lanterne.css">
<style>
/* LA SPEDIZIONE COMPLETA: la struttura B (Gloomhaven digitale, Mansions of
   Madness) con la plancia a lanterne in mezzo.
   A sinistra GLI EROI, tutti e sempre: salute, azioni, attributi, arma,
   abilita' in spedizione con le cariche. Quello di turno si apre: i suoi
   tasti e l'ultimo tiro spiegato dado per dado. A destra LA NOTTE: il canto
   con le sue soglie, il mazzo, ogni nemico coi suoi numeri e cosa fara' al
   suo turno, l'obiettivo, Ruggero, gli oggetti, il diario. Nessuna colonna
   nasconde la salute di qualcuno sotto la piega. */
body { overflow: hidden; }
.sp { position: fixed; inset: 0; display: grid; grid-template-columns: 320px 1fr 310px; grid-template-rows: auto 1fr; gap: 8px; padding: 8px; }
.lastra { background: var(--ardesia); border: 1px solid var(--bordo); border-radius: 10px; }
.sc { font-family: 'FellSC', serif; letter-spacing: .04em; }
.col { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; }
.col h3 { font: 13px 'FellSC', serif; letter-spacing: .08em; color: var(--osso-fioco); margin: 4px 4px 0; }
.col.notte h3 { color: #e0707a; }

/* il capo */
.capo { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 12px; }
.capo .ep { font: 15px 'FellSC', serif; color: var(--nastro-chiaro); white-space: nowrap; }
.capo .fase { padding: 3px 10px; border-radius: 99px; font: 13px 'FellSC', serif; background: rgba(232,194,122,.14); color: var(--nastro-chiaro); white-space: nowrap; }
.capo .fase.notte { background: rgba(200,50,63,.2); color: #f19aa3; }
.capo .campane { display: flex; gap: 3px; align-items: flex-end; }
.capo .campane i { width: 9px; height: 15px; border-radius: 5px 5px 2px 2px; background: rgba(255,255,255,.08); border: 1px solid var(--bordo); }
.capo .campane i.suona { background: #b8454f; border-color: #e0707a; box-shadow: 0 0 6px rgba(217,96,109,.55); }
.capo .campane i.soglia { outline: 1px solid var(--nastro); outline-offset: 1px; }
.capo .quanto { font: 13px 'FellSC', serif; color: var(--osso-fioco); white-space: nowrap; }
.capo .quanto b { color: #f19aa3; font-weight: normal; font-size: 16px; }
.capo .ob { flex: 1; font-size: 13px; color: var(--osso-fioco); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.capo .bt { padding: 7px 14px; border-radius: 99px; background: rgba(30,35,42,.86); border: 1px solid var(--bordo-alto); font: 14px 'FellSC', serif; }

/* LA CARTA DI UN EROE */
.ce { padding: 8px 10px; display: grid; grid-template-columns: 46px 1fr; gap: 3px 10px; cursor: pointer; transition: border-color .2s, background .2s; }
.ce .rit { grid-row: span 2; width: 46px; height: 46px; border-radius: 50%; overflow: hidden; border: 2px solid var(--nastro); align-self: center; }
.ce .rit img { width: 100%; height: 100%; object-fit: cover; }
.ce .riga1 { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.ce .nome { font: 16px 'FellSC', serif; }
.ce .tag { font: italic 12px 'OldStd', serif; color: var(--osso-fioco); white-space: nowrap; }
.ce .tag.male { color: #f19aa3; }
.ce .riga2 { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--osso-fioco); }
.pips { display: inline-flex; gap: 2px; }
.pips i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--bordo-alto); background: rgba(255,255,255,.05); }
.pips.vita i.pieno { background: var(--ceralacca); border-color: var(--ceralacca); }
.pips.az i.pieno { background: var(--nastro); border-color: var(--nastro); }
.pips.car i.pieno { background: #8fb7ff; border-color: #8fb7ff; }
.numero { font: 700 13px 'OldStd', serif; color: var(--osso); }
.numero.grave { color: #f19aa3; }
.ce.fatto { opacity: .55; } .ce.giu { opacity: .45; } .ce.giu .rit { filter: grayscale(1); }
.ce.grave .rit { border-color: var(--ceralacca); box-shadow: 0 0 10px rgba(217,96,109,.7); }
/* l'eroe di turno: la carta si apre */
.ce.on { border-color: var(--nastro); background: rgba(38, 33, 24, .92); box-shadow: 0 0 18px rgba(232,194,122,.16); cursor: default; }
.ce.on .rit { width: 62px; height: 62px; }
.ce.on { grid-template-columns: 62px 1fr; }
.ce .dett { grid-column: 1 / -1; display: none; flex-direction: column; gap: 8px; margin-top: 6px; }
.ce.on .dett { display: flex; }
.attr { display: flex; flex-wrap: wrap; gap: 4px; }
.attr span { padding: 2px 7px; border-radius: 4px; background: rgba(255,255,255,.05); border: 1px solid var(--bordo); font: 12px 'FellSC', serif; color: var(--osso-fioco); }
.attr span b { color: var(--osso); font: 700 13px 'OldStd', serif; margin-left: 3px; }
.abil { padding: 7px 9px; border-radius: 6px; background: rgba(143,183,255,.07); border: 1px solid rgba(143,183,255,.2); font-size: 13px; line-height: 1.35; }
.abil .t { display: flex; justify-content: space-between; align-items: center; font: 14px 'FellSC', serif; color: #c9dcff; margin-bottom: 2px; }
.tasti { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.tasto { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 7px 9px; border-radius: 8px; text-align: left;
  background: rgba(30,35,42,.9); border: 1px solid var(--bordo-alto); }
.tasto b { font: 14px 'FellSC', serif; font-weight: normal; }
.tasto small { font: italic 11px 'OldStd', serif; color: var(--osso-fioco); }
.tasto:disabled { opacity: .33; cursor: default; }
.tasto.suggerito { border-color: rgba(127,230,219,.6); }
.tasto.fine { grid-column: 1 / -1; align-items: center; background: var(--nastro); color: #1d1710; border-color: var(--nastro); }
.tasto.fine small { color: #5a4520; }
.tasto.fine.spinge { animation: spinge 1.4s infinite; }
@keyframes spinge { 50% { box-shadow: 0 0 0 5px rgba(232,194,122,.3); } }
.tiro { padding: 8px 10px; border-radius: 6px; background: rgba(0,0,0,.35); border-left: 3px solid var(--osso-fioco); font-size: 13px; }
.tiro.buono { border-left-color: #6fc79a; } .tiro.cattivo { border-left-color: var(--ceralacca); }
.tiro .cosa { font: 12px 'FellSC', serif; color: var(--osso-fioco); }
.tiro .conto { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; margin: 4px 0; }
.tiro .dado { width: 24px; height: 24px; border-radius: 5px; background: var(--carta); color: var(--carta-ink); display: grid; place-items: center; font: 700 15px 'OldStd', serif; }
.tiro .esito { font: 15px 'FellSC', serif; }
.tiro.buono .esito { color: #9fe0bd; } .tiro.cattivo .esito { color: #f19aa3; }
.tiro .testo { font-style: italic; color: var(--osso-fioco); margin-top: 3px; }
.guida { font-size: 12px; font-style: italic; color: var(--osso-fioco); }

/* la plancia */
.centro { position: relative; min-height: 0; display: grid; grid-template-rows: 1fr auto; gap: 4px; }
.centro .plancia-l { border-radius: 10px; border: 1px solid var(--bordo); }
.striscia { position: absolute; z-index: 20; left: 50%; top: 10px; transform: translateX(-50%); padding: 5px 14px; border-radius: 99px;
  background: rgba(0,0,0,.65); font: 14px 'FellSC', serif; color: var(--nastro-chiaro); pointer-events: none; white-space: nowrap; }
.striscia.notte { color: #f19aa3; box-shadow: 0 0 20px rgba(200,50,63,.5); }
.credito { font-size: 11px; color: var(--osso-fioco); opacity: .6; text-align: center; font-style: italic; }

/* LA NOTTE */
.torre { padding: 10px 12px; }
.torre .testa { display: flex; justify-content: space-between; align-items: baseline; }
.torre .num { font: 30px 'FellSC', serif; color: #f19aa3; line-height: 1; }
.torre .num small { font-size: 14px; color: var(--osso-fioco); }
.torre .scala { display: flex; flex-direction: column-reverse; gap: 3px; margin: 8px 0 6px; }
.torre .gr { display: flex; align-items: center; gap: 10px; height: 12px; }
.torre .gr i { width: 44px; height: 11px; border-radius: 3px; background: rgba(255,255,255,.06); border: 1px solid var(--bordo); flex: none; }
.torre .gr i.suona { background: linear-gradient(90deg, #8e2632, #d9606d); border-color: #e0707a; }
.torre .gr.soglia i { outline: 1px solid var(--nastro); outline-offset: 1px; }
.torre .gr span { font: italic 12px 'OldStd', serif; color: var(--nastro-chiaro); white-space: nowrap; }
.torre .mazzo { font-size: 13px; color: var(--osso-fioco); }
.nem { padding: 8px 10px; display: grid; grid-template-columns: 40px 1fr; gap: 2px 9px; }
.nem .rit { grid-row: span 3; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 2px solid var(--segnale-nemico); align-self: start; }
.nem .rit img { width: 100%; height: 100%; object-fit: cover; }
.nem .n { display: flex; justify-content: space-between; font: 14px 'FellSC', serif; }
.nem .num4 { display: flex; gap: 4px; flex-wrap: wrap; }
.nem .num4 span { font: 11px 'FellSC', serif; color: var(--osso-fioco); padding: 1px 5px; border-radius: 3px; background: rgba(255,255,255,.05); }
.nem .num4 span b { color: var(--osso); font: 700 12px 'OldStd', serif; }
.nem .int { font-size: 12px; color: #f19aa3; font-style: italic; }
.nem .int.lontano { color: var(--osso-fioco); }
.nem.on { border-color: var(--segnale-nemico); box-shadow: 0 0 16px rgba(200,50,63,.35); }
.nem:hover { border-color: rgba(255,243,207,.5); }
.vuoto { padding: 10px 12px; font-size: 13px; color: var(--osso-fioco); font-style: italic; }
.scheda { padding: 10px 12px; font-size: 13px; line-height: 1.4; }
.scheda b { font: 14px 'FellSC', serif; font-weight: normal; color: var(--nastro-chiaro); }
.png { display: flex; gap: 10px; align-items: center; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--bordo); }
.png img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #8fb7ff; filter: grayscale(.4); }
.ogg { padding: 5px 0; border-top: 1px solid var(--bordo); }
.ogg:first-of-type { border-top: 0; }
.ogg i { color: var(--osso-fioco); font-size: 12px; display: block; }
.diario p { padding: 4px 0; border-top: 1px solid var(--bordo); color: var(--osso-fioco); font-size: 12.5px; }
.diario p:first-of-type { border-top: 0; color: var(--osso); }
.diario p.male { color: #f19aa3; } .diario p.bene { color: #9fe0bd; }

/* TELEFONO: la plancia in cima, sotto le schede */
.schede { display: none; }
@media (max-width: 900px) {
  /* minmax(0,1fr): senza, il capo che non va a capo allarga tutta la pagina e
     il menu e la scheda «diario» finiscono fuori dallo schermo */
  .sp { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 46vh auto 1fr; padding: 5px; gap: 5px; }
  .capo { gap: 8px; padding: 6px 8px; min-width: 0; } .capo .ob, .capo .quanto span, .capo .campane { display: none; }
  .capo .ep { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .centro { grid-row: 2; } .schede { grid-row: 3; display: flex; gap: 4px; } .col { grid-row: 4; grid-column: 1; display: none; }
  .col.vis { display: flex; }
  .schede button { flex: 1; padding: 8px; border-radius: 8px; font: 14px 'FellSC', serif; background: var(--ardesia); border: 1px solid var(--bordo); }
  .schede button.on { border-color: var(--nastro); color: var(--nastro-chiaro); }
  .credito { display: none; }
  .col.notte[data-vista="notte"] > .sez-diario { display: none; }
  .col.notte[data-vista="diario"] > :not(.sez-diario) { display: none; }
}
</style></head><body>
<div class="sp">
  <div class="capo lastra" id="capo"></div>
  <div class="col eroi vis" id="c-eroi" data-s="eroi"></div>
  <div class="centro"><div id="plancia"></div><p class="credito">Mappe realizzate con asset di Forgotten Adventures (CC BY-NC-SA 4.0)</p><div class="striscia" id="striscia"></div></div>
  <div class="schede" id="schede"><button data-s="eroi" class="on">eroi</button><button data-s="notte">la notte</button><button data-s="diario">diario</button></div>
  <div class="col notte" id="c-notte" data-s="notte"></div>
</div>
<script src="mondo.js"></script>
<script src="regole.js"></script>
<script src="lanterne.js"></script>
<script>
const M = MONDO, $ = (id) => document.getElementById(id), esc = M.esc;
const pips = (n, max, cls) => `<span class="pips ${cls}">${Array.from({ length: max }, (_, i) => `<i class="${i < n ? 'pieno' : ''}"></i>`).join('')}</span>`;
const SOGLIE = { 3: 'il coro si sveglia', 8: 'mezzanotte del coro' };
let scheda = 'eroi', plancia = null;

M.regole.then(() => {
  plancia = LANTERNE.monta($('plancia'));
  M.on(hud); hud();
});

function cartaEroe(e, i) {
  const on = M.fase === 'eroi' && i === M.attivo;
  const giu = e.hp <= 0, grave = !giu && e.hp / e.max <= 1 / 3;
  const tag = giu ? '<span class="tag male">a terra</span>' : e.finito ? '<span class="tag">ha agito</span>' : on ? '<span class="tag">di turno</span>' : `<span class="tag">${esc(e.ruolo)}</span>`;
  let dett = '';
  if (on) {
    const colpi = M.bersagli(e), mosse = Object.keys(M.raggiungibili(e)).length;
    const ultimo = M.eroi.filter((x) => !x.finito && x.hp > 0).length <= 1;
    const t = M.tiro;
    dett = `<div class="dett">
      <div class="attr"><span>Acume<b>${e.acume}</b></span><span>Vigore<b>${e.vigore}</b></span><span>Nervi<b>${e.nervi}</b></span>
        <span>Difesa<b>${e.difesa}</b></span><span>${esc(e.armaNome.toLowerCase())}<b>+${e.arma}</b></span></div>
      <div class="abil"><div class="t"><span>${esc(e.abilNome)}</span>${e.passiva ? '<small class="guida">sempre attiva</small>' : pips(e.car, e.carMax, 'car')}</div>${esc(e.abilTesto)}</div>
      <div class="tasti">
        <button class="tasto${mosse ? ' suggerito' : ''}" disabled><b>Muovi</b><small>${e.mosso ? 'gia’ mosso' : mosse ? `tocca un quadrato · fino a ${e.mov}` : 'nessuna casella'}</small></button>
        <button class="tasto${colpi.length ? ' suggerito' : ''}" disabled><b>Attacca</b><small>${e.attaccato ? 'gia’ attaccato' : colpi.length ? `tocca il nemico cerchiato` : 'nessuno accanto'}</small></button>
        <button class="tasto" data-az="cerca" ${M.puoCercare(e) ? '' : 'disabled'}><b>Cerca</b><small>2d6 + Acume ${e.acume} contro 9</small></button>
        <button class="tasto" data-az="abilita" ${M.puoAbilita(e) ? '' : 'disabled'}><b>${esc(e.abilNome)}</b><small>${e.passiva ? 'passiva' : `${e.car} di ${e.carMax} cariche`}</small></button>
        <button class="tasto" disabled><b>Oggetto</b><small>${M.oggetti.length ? `${M.oggetti.length} nel gruppo` : 'nessuno'}</small></button>
        <button class="tasto" disabled><b>Interagire</b><small>niente qui accanto</small></button>
        <button class="tasto fine${M.restano(e) <= 0 ? ' spinge' : ''}" data-az="fine"><b>${ultimo ? 'la notte reagisce →' : `${esc(e.nome)} ha finito →`}</b><small>${M.restano(e)} ${M.restano(e) === 1 ? 'azione' : 'azioni'} ancora</small></button>
      </div>
      ${t ? `<div class="tiro ${t.buono ? 'buono' : 'cattivo'}"><div class="cosa">${esc(t.cosa)}</div>
        <div class="conto">${t.dadi.map((d) => `<span class="dado">${d}</span>`).join('+')}${t.bonus.map(([n, v]) => ` + <span>${esc(n)} ${v}</span>`).join('')}
          = <b>${t.tot}</b> contro ${esc(t.nomeSoglia)} ${t.soglia} · <span class="esito">${esc(t.esito)}</span></div>
        ${t.testo ? `<div class="testo">${esc(t.testo)}</div>` : ''}</div>` : '<p class="guida">Muovi e attacchi si fanno sulla mappa: quadrati turchesi per andare, oro per aprire, rossi per colpire.</p>'}
    </div>`;
  }
  return `<div class="ce lastra${on ? ' on' : ''}${e.finito && !giu ? ' fatto' : ''}${giu ? ' giu' : ''}${grave ? ' grave' : ''}" data-eroe="${e.id}">
    <div class="rit"><img src="${e.art}" alt=""></div>
    <div class="riga1"><span class="nome">${esc(on ? e.nomeIntero.toLowerCase() : e.nome)}</span>${tag}</div>
    <div class="riga2">${pips(e.hp, e.max, 'vita')}<span class="numero${grave ? ' grave' : ''}">${e.hp}/${e.max}</span>${pips(M.restano(e) * (e.finito ? 0 : 1), 2, 'az')}${!e.passiva ? pips(e.car, e.carMax, 'car') : ''}</div>
    ${dett}</div>`;
}

function hud() {
  const notte = M.fase === 'nemici', e = M.att();
  $('capo').innerHTML = `<span class="ep">Il Coro Sommerso</span><span class="fase${notte ? ' notte' : ''}">${notte ? 'agisce la notte' : `round ${M.round} · gli eroi`}</span>
    <span class="campane">${Array.from({ length: M.cantoMax }, (_, i) => `<i class="${i < M.canto ? 'suona' : ''}${i + 1 === M.soglia ? ' soglia' : ''}"></i>`).join('')}</span>
    <span class="quanto">canto <b>${M.canto}</b>/${M.cantoMax}<span> · mazzo ${M.mazzo}</span></span>
    <span class="ob"><b>Obiettivo</b> — ${esc(M.obiettivo)}</span><button class="bt">menu</button>`;
  $('striscia').className = `striscia${notte ? ' notte' : ''}`;
  $('striscia').textContent = notte ? 'La notte agisce…' : `Tocca a ${e.nome} · ${M.restano(e)} ${M.restano(e) === 1 ? 'azione' : 'azioni'}`;
  $('c-eroi').innerHTML = `<h3>gli eroi</h3>` + M.eroi.map(cartaEroe).join('');

  const nemici = M.nemici.filter((n) => n.hp > 0);
  const soglie = new Set([M.soglia, M.cantoMax]);
  const sc = M.scortato;
  $('c-notte').innerHTML = `
    <div class="lastra torre"><div class="testa"><h3 style="margin:0">il canto</h3><div class="num">${M.canto}<small>/${M.cantoMax}</small></div></div>
      <div class="scala">${Array.from({ length: M.cantoMax }, (_, i) => `<div class="gr${soglie.has(i + 1) ? ' soglia' : ''}"><i class="${i < M.canto ? 'suona' : ''}"></i><span>${esc(SOGLIE[i + 1] || '')}</span></div>`).join('')}</div>
      <div class="mazzo">mazzo della minaccia: <b>${M.mazzo}</b> carte · la notte ne pesca una a ogni round</div></div>
    <h3>i nemici in campo</h3>
    ${nemici.length ? nemici.map((n) => { const it = !notte ? M.intento(n) : null; const s = M.stanzaDi(n.c, n.r);
      return `<div class="nem lastra${M.agisce === n.id ? ' on' : ''}" data-nemico="${n.id}"><div class="rit"><img src="${n.art}" alt=""></div>
        <div class="n"><span>${esc(n.nome.toLowerCase())}</span>${pips(n.hp, n.max, 'vita')}</div>
        <div class="num4"><span>Att<b>+${n.att}</b></span><span>Dif<b>${n.dif}</b></span><span>Dan<b>${n.dan}</b></span><span>Mov<b>${n.mov}</b></span><span>${esc(s ? s.nome.toLowerCase() : '')}</span></div>
        <div class="int${it && !it.arriva ? ' lontano' : ''}">${M.agisce === n.id ? 'agisce ora…' : !it ? 'non trova nessuno'
          : it.arriva ? `al suo turno → ${esc(it.bersaglio.nome)}: 2d6+${n.att} contro Difesa ${it.bersaglio.difesa}, −${n.dan}` : `si avvicina a ${esc(it.bersaglio.nome)}`}</div></div>`; }).join('')
      : '<div class="lastra vuoto">Nessun nemico in vista. Quel che sta nelle stanze chiuse non si conta finche’ non si apre la porta.</div>'}
    <h3>l’obiettivo</h3>
    <div class="lastra scheda">${esc(M.obiettivo)}
      ${sc ? `<div class="png"><img src="${M.art(sc.art)}" alt=""><div><b>${esc(sc.nome)}</b><br>nella cella della cripta — ancora da trovare.<br>
        <span class="guida">Interagire: prova di ${esc(sc.prova.attr)} ${esc(sc.prova.diff)}${sc.prova.bonus && sc.prova.bonus.length ? `; aiuta ${esc(sc.prova.bonus.join(', '))}` : ''}.</span></div></div>` : ''}</div>
    <h3>gli oggetti del gruppo</h3>
    <div class="lastra scheda">${M.oggetti.map((o) => `<div class="ogg"><b>${esc(o.nome.toLowerCase())}</b><i>${esc(o.effetto)}</i></div>`).join('') || '<span class="guida">Nessuno.</span>'}</div>
    <h3 class="sez-diario">il diario</h3>
    <div class="lastra scheda diario sez-diario">${M.diario.slice(0, 8).map((d) => `<p class="${d.tono}">${esc(d.testo)}</p>`).join('')}</div>`;
  vista();
}

// sul telefono le colonne diventano schede
function vista() {
  const stretto = matchMedia('(max-width: 900px)').matches;
  $('c-eroi').classList.toggle('vis', !stretto || scheda === 'eroi');
  $('c-notte').classList.toggle('vis', !stretto || scheda !== 'eroi');
  // una scheda, una cosa: «la notte» senza il diario, «diario» solo il diario
  $('c-notte').dataset.vista = stretto ? scheda : '';
}
document.addEventListener('click', (ev) => {
  const s = ev.target.closest('.schede button');
  if (s) { scheda = s.dataset.s; document.querySelectorAll('.schede button').forEach((b) => b.classList.toggle('on', b === s)); return vista(); }
  const a = ev.target.closest('[data-az]');
  if (a) { ({ cerca: M.cerca, abilita: M.abilita, fine: M.fine })[a.dataset.az](); return; }
  const c = ev.target.closest('.ce[data-eroe]'); if (c) M.seleziona(c.dataset.eroe);
});
// passare sopra a un nemico nella colonna lo indica sulla mappa
document.addEventListener('mouseover', (ev) => { const n = ev.target.closest('[data-nemico]'); if (plancia) plancia.evidenzia(n ? n.dataset.nemico : null); });
addEventListener('resize', vista);
</script>
</body></html>
