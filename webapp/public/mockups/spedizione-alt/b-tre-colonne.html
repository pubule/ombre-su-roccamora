<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spedizione B · tre colonne</title>
<link rel="stylesheet" href="comune.css">
<style>
/* B — TRE COLONNE (Gloomhaven digitale, Mansions of Madness).
   A sinistra gli eroi, TUTTI e sempre: salute, azioni, cariche — nessuno
   scorre per sapere chi sta per cadere. Al centro la mappa. A destra LA NOTTE:
   il canto come una torre che si riempie, il mazzo che si assottiglia, e ogni
   nemico con quel che fara' al suo turno (Into the Breach): l'ansia si vede
   arrivare invece di scoprirla dopo. Le azioni stanno dentro la carta
   dell'eroe di turno, dove si guarda gia'. */
.b { position: fixed; inset: 0; display: grid; grid-template-columns: 270px 1fr 280px; grid-template-rows: auto 1fr; gap: 10px; padding: 10px; }
.capo { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 8px 12px; }
.capo .ob { flex: 1; font-size: 14px; color: var(--osso-fioco); font-style: italic; }
.capo .ob b { color: var(--osso); font-style: normal; }
.capo .round { font-size: 15px; color: var(--nastro-chiaro); }
.col { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.b .plancia { min-height: 0; border-radius: 10px; border: 1px solid var(--bordo); background: #08090b; }

/* le carte degli eroi */
.ce { padding: 8px; display: grid; grid-template-columns: 50px 1fr; gap: 4px 10px; align-items: center; cursor: pointer; transition: all .2s; }
.ce .rit { grid-row: span 2; width: 50px; height: 50px; border-radius: 50%; overflow: hidden; border: 2px solid var(--nastro); }
.ce .rit img { width: 100%; height: 100%; object-fit: cover; }
.ce .nome { font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
.ce .nome small { font: italic 12px 'OldStd', serif; color: var(--osso-fioco); }
.ce .stato { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.ce .stato span { display: inline-flex; gap: 3px; }
.ce.on { border-color: var(--nastro); background: rgba(40, 36, 28, .9); box-shadow: 0 0 18px rgba(232,194,122,.18); }
.ce.fatto { opacity: .5; } .ce.giu { opacity: .4; filter: grayscale(1); }
.ce.grave .rit { border-color: var(--ceralacca); box-shadow: 0 0 10px rgba(217,96,109,.7); }
.ce .azioni { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 6px; }
.ce .azioni .btn { padding: 7px 8px; font-size: 13px; justify-content: flex-start; border-radius: 8px; }
.ce .azioni .btn .ic { width: 17px; height: 17px; }
.ce .azioni .fine { grid-column: 1 / -1; justify-content: center; }
.ce .suggerisce { grid-column: 1 / -1; font-size: 13px; font-style: italic; color: var(--osso-fioco); margin-top: 4px; }

/* la notte */
.notte h3, .col h3 { font: 14px 'FellSC', serif; color: #e0707a; letter-spacing: .06em; margin-bottom: 6px; }
.torre { padding: 10px 12px; }
.torre .testa { display: flex; align-items: baseline; justify-content: space-between; }
.torre .num { font: 34px 'FellSC', serif; color: #f19aa3; line-height: 1; }
.torre .num small { font-size: 15px; color: var(--osso-fioco); }
.torre .scala { display: flex; flex-direction: column-reverse; gap: 3px; margin: 8px 0; }
.torre .gr { display: flex; align-items: center; gap: 10px; height: 12px; }
.torre .gr i { width: 44px; height: 11px; border-radius: 3px; background: rgba(255,255,255,.06); border: 1px solid var(--bordo); flex: none; }
.torre .gr i.suona { background: linear-gradient(90deg, #8e2632, #d9606d); border-color: #e0707a; }
.torre .gr.soglia i { outline: 1px solid var(--nastro); outline-offset: 1px; }
.torre .gr span { font: italic 12px 'OldStd', serif; color: var(--nastro-chiaro); white-space: nowrap; }
.torre .gr.passata span { color: #f19aa3; text-decoration: line-through; }
.torre .mazzo { font-size: 13px; color: var(--osso-fioco); }
.nem { padding: 8px; display: grid; grid-template-columns: 40px 1fr; gap: 2px 8px; align-items: center; }
.nem .rit { grid-row: span 2; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; border: 2px solid var(--segnale-nemico); }
.nem .rit img { width: 100%; height: 100%; object-fit: cover; }
.nem .n { font-size: 14px; display: flex; justify-content: space-between; }
.nem .int { font-size: 13px; color: #f19aa3; font-style: italic; }
.nem .int.lontano { color: var(--osso-fioco); }
.nem.on { border-color: var(--segnale-nemico); box-shadow: 0 0 16px rgba(200,50,63,.4); }
.diario { padding: 10px 12px; font-size: 13px; }
.diario p { padding: 4px 0; border-top: 1px solid var(--bordo); color: var(--osso-fioco); }
.diario p:first-of-type { border-top: 0; color: var(--osso); }

/* telefono: la mappa in cima, sotto le schede */
.schede { display: none; }
@media (max-width: 820px) {
  .b { grid-template-columns: 1fr; grid-template-rows: auto 48vh auto 1fr; padding: 6px; gap: 6px; }
  .capo .ob { display: none; }
  .b .plancia { grid-row: 2; } .schede { grid-row: 3; } .col { grid-row: 4; grid-column: 1; }
  .schede { display: flex; gap: 4px; }
  .schede button { flex: 1; padding: 8px; border-radius: 8px; font: 14px 'FellSC', serif; background: var(--ardesia); border: 1px solid var(--bordo); }
  .schede button.on { border-color: var(--nastro); color: var(--nastro-chiaro); }
  .col { display: none; } .col.vis { display: flex; }
  .ce { grid-template-columns: 44px 1fr; } .ce .rit { width: 44px; height: 44px; }
}
</style></head><body>
<div class="b">
  <div class="capo lastra" id="capo"></div>
  <div class="schede" id="schede"><button data-s="eroi" class="on">eroi</button><button data-s="notte">la notte</button><button data-s="diario">diario</button></div>
  <div class="col vis" id="c-eroi" data-s="eroi"></div>
  <div id="pl"></div>
  <div class="col notte" id="c-notte" data-s="notte"></div>
</div>
<a class="torna" href="index.html">← le alternative</a>
<script src="comune.js"></script>
<script>
const { S, art, esc, plancia, ascolta, azioni, premi, suggerimento, pips, icona, att, restano, nemiciVivi, intento } = SPED;
plancia(document.getElementById("pl"), { mosseSempre: true });
const $ = (id) => document.getElementById(id);
const SOGLIE = { 4: 'il coro si sveglia', 8: 'la cera cola', 12: 'mezzanotte del coro' };
let scheda = 'eroi';
function hud() {
  $('capo').innerHTML = `<span class="round sc">round ${S.round}</span>
    <span class="ob"><b>Obiettivo</b> — ${esc(S.obiettivo)}</span>
    <button class="btn">${icona('suoni')}</button><button class="btn">${icona('menu')}menu</button>`;
  const e = att();
  $('c-eroi').innerHTML = S.eroi.map((x, i) => {
    const on = S.fase === 'eroi' && i === S.attivo;
    return `<div class="ce lastra${on ? ' on' : ''}${x.finito && x.hp > 0 ? ' fatto' : ''}${x.hp <= 0 ? ' giu' : ''}${x.hp > 0 && x.hp / x.max <= 1 / 3 ? ' grave' : ''}" data-eroe="${x.id}">
      <div class="rit"><img src="${art(x.art)}" alt=""></div>
      <div class="nome sc">${esc(x.nome)} <small>${x.hp <= 0 ? 'a terra' : x.finito ? 'ha agito' : esc(x.ruolo)}</small></div>
      <div class="stato"><span>${pips(x.hp, x.max, 'vita')}</span><span>${pips(restano(x), 2, 'az')}</span><span>${pips(x.car, x.carMax, 'car')}</span></div>
      ${on ? `<div class="azioni">${azioni().filter((z) => z.id !== 'muovi' && z.id !== 'attacca').map((z) =>
        `<button class="btn" data-az="${z.id}" ${z.ok ? '' : 'disabled'}>${icona(z.id)}${esc(z.nome)}</button>`).join('')}
        <button class="btn pieno fine" data-az="fine">${S.eroi.filter((y) => !y.finito && y.hp > 0).length <= 1 ? 'la notte reagisce →' : 'ha finito →'}</button></div>
        <div class="suggerisce">${esc(suggerimento())} Muovi e attacchi si fanno toccando la mappa.</div>` : ''}
    </div>`;
  }).join('');
  const soglie = new Set(S.soglie);
  $('c-notte').innerHTML = `<div class="lastra torre"><div class="testa"><h3>il canto</h3><div class="num">${S.canto}<small>/${S.cantoMax}</small></div></div>
      <div class="scala">${Array.from({ length: S.cantoMax }, (_, i) => `<div class="gr${soglie.has(i + 1) ? ' soglia' : ''}${soglie.has(i + 1) && i < S.canto ? ' passata' : ''}">
        <i class="${i < S.canto ? 'suona' : ''}"></i><span>${esc(SOGLIE[i + 1] || '')}</span></div>`).join('')}</div>
      <div class="mazzo">mazzo della minaccia: <b>${S.mazzo}</b> carte</div></div>
    <h3 style="margin:6px 2px 0">la notte, al suo turno</h3>
    ${nemiciVivi().map((n) => { const it = S.fase === 'eroi' ? intento(n) : null;
      return `<div class="nem lastra${S.agisce === n.id ? ' on' : ''}"><div class="rit"><img src="${art(n.art)}" alt=""></div>
        <div class="n sc"><span>${esc(n.nome.toLowerCase())}</span><span>${pips(n.hp, n.max, 'vita')}</span></div>
        <div class="int${it && !it.arriva ? ' lontano' : ''}">${S.agisce === n.id ? 'agisce ora…' : !it ? '—'
          : it.arriva ? `→ ${esc(it.bersaglio.nome)}, −${it.dan} se colpisce` : `si avvicina a ${esc(it.bersaglio.nome)}`}</div></div>`; }).join('')}
    <div class="lastra diario" data-s="diario"><h3>diario</h3>${S.diario.slice(0, 6).map((d) => `<p>${esc(d.testo)}</p>`).join('') || '<p>La spedizione comincia.</p>'}</div>`;
  document.querySelectorAll('.col').forEach((c) => c.classList.toggle('vis', matchMedia('(max-width: 820px)').matches ? c.dataset.s === scheda || (scheda === 'diario' && c.dataset.s === 'notte') : true));
}
document.addEventListener('click', (ev) => {
  const s = ev.target.closest('.schede button');
  if (s) { scheda = s.dataset.s; document.querySelectorAll('.schede button').forEach((b) => b.classList.toggle('on', b === s)); hud(); return; }
  const b = ev.target.closest('[data-az]'); if (b) return premi(b.dataset.az);
  const c = ev.target.closest('.ce[data-eroe]'); if (c) SPED.seleziona(c.dataset.eroe);
});
addEventListener('resize', hud);
ascolta.push(hud); hud();
</script>
</body></html>
