<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Il Fascicolo · chi scende in strada</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="fascicolo.css">
<style>
  /* l'arruolamento e' una tavola di stampe: chi e' arruolato ha la spilla di
     ceralacca, gli altri restano fotografie in archivio */
  .tavola { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr));
    gap: 14px; margin-top: 12px; }
  .scheda { background: var(--carta); padding: 6px 6px 8px; cursor: pointer;
    box-shadow: 0 10px 18px -12px #000; transform: rotate(-.8deg); position: relative; }
  .tavola > :nth-child(even) .scheda { transform: rotate(.9deg); }
  .scheda img { width: 100%; height: 108px; object-fit: cover;
    filter: grayscale(.85) sepia(.25) contrast(1.05); }
  .scheda .nome { font-family: 'FellSC', serif; font-size: 12px; letter-spacing: .04em;
    color: var(--carta-ink); display: block; margin-top: 5px; text-align: center; }
  .scheda .ruolo { font-size: 11px; font-style: italic; color: #6b6353;
    display: block; text-align: center; }
  .scheda.scelto { transform: rotate(0deg) translateY(-3px); }
  .scheda.scelto img { filter: none; }
  .scheda.scelto::after { content: ''; position: absolute; top: -7px; right: -7px;
    width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 38% 32%, #c8384c, var(--ceralacca) 60%, #6d1522);
    box-shadow: 0 3px 7px -2px #000; }
  .conto { font-family: 'FellSC', serif; letter-spacing: .1em; color: var(--osso-fioco);
    font-size: 14px; }
</style>
</head><body>
<div class="wrap">
  <a class="torna" href="index.html">← le tre direzioni</a>

  <div class="testata">
    <span class="etichetta">fascicolo 1 · arruolamento</span>
    <h1>chi scende in strada</h1>
    <div class="sotto">da 2 a 10 investigatori — le regole scalano sulla taglia del gruppo</div>
  </div>

  <div class="lastra">
    <p class="nota" style="margin-top:0">Toccate una fotografia per leggere chi è, e decidere
    se arruolarlo. Chi entra nel gruppo prende la spilla.</p>
    <div class="conto" id="conto"></div>
    <div class="tavola" id="tavola"></div>
    <div class="riga"><button class="btn pieno">si comincia</button></div>
  </div>
</div>

<script src="../dati.js"></script>
<script>
  const { S, esc } = MOCK;
  const A = (p) => '/assets/artworks/' + encodeURI(p);
  // qualche volto in più oltre al party, per far vedere la tavola piena
  const volti = S.party.concat([
    { nome: 'CARLA DOSTI', breve: 'carla', ruolo: 'La Sensitiva', art: 'Carla.png' },
    { nome: 'DOTT. LAZZARO SERRA', breve: 'lazzaro', ruolo: 'L’Alienista', art: 'Lazzaro.png' },
    { nome: 'MORA “SPILLA” FANTI', breve: 'mora', ruolo: 'La Borseggiatrice', art: 'Mora.png' },
    { nome: 'CELSO', breve: 'celso', ruolo: 'Il Chierico', art: 'Celso.png' },
  ]);
  const scelti = new Set(['ELENA FOSCO', 'DOTT. ATTILIO MARN', 'NINO “GRIMALDELLO” CAUTO']);

  document.getElementById('tavola').innerHTML = volti.map((e) => `
    <div>
      <div class="scheda ${scelti.has(e.nome) ? 'scelto' : ''}">
        <img src="${A(e.art)}" alt="" loading="lazy">
        <span class="nome">${esc(e.breve)}</span>
        <span class="ruolo">${esc(e.ruolo)}</span>
      </div>
    </div>`).join('');
  document.getElementById('conto').textContent = scelti.size + ' arruolati';
</script>
</body></html>
