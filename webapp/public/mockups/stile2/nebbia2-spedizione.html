<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notte e nebbia · spedizione</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="nebbia.css">
<link rel="stylesheet" href="nebbia2.css">
</head><body>
<div class="wrap largo">
  <a class="torna" href="index.html">← le tre direzioni</a>

  <!-- LO STESSO CAPO DELL'INDAGINE: a sinistra la risorsa che scorre (lì
       l'ora, qui il canto), a destra il menu con il bollino. Chi passa dalla
       prima metà della serata alla seconda non deve reimparare niente. -->
  <div class="capo">
    <span class="ora">
      <span class="lumi" id="canto"></span>
      <span class="quante">round 3</span>
    </span>
    <button class="btn btn-menu" id="apri-menu">
      <svg class="ic" aria-hidden="true"><use href="#i-lanterna"></use></svg>menu
      <span class="segno" aria-label="cose nuove nel diario"></span>
    </button>
  </div>

  <div class="turno" id="turno"></div>

  <div class="lastra">
    <p class="nota" style="margin:0"><b>Obiettivo:</b> liberate Ruggero — la cella è nella
      cripta — e riportatelo alla banchina.</p>
  </div>

  <!-- LA MAPPA A STANZE: l'arte della tessera è il pavimento, il reticolo sta
       sopra, e quel che non è stato rivelato è nebbia invece che un buco. -->
  <div class="lastra board-area" style="padding:10px">
    <div class="mappa"><div class="stanze" id="stanze"></div></div>
    <div class="zoom-ctrl">
      <button class="zoom-btn" aria-label="rimpicciolisci">−</button>
      <button class="zoom-btn" aria-label="tutta la mappa">⤢</button>
      <button class="zoom-btn" aria-label="ingrandisci">+</button>
    </div>
  </div>
  <p class="nota" style="text-align:center">Trascinate per spostare la mappa · +/− per lo zoom</p>

  <!-- LE AZIONI: stessa griglia dell'Indagine, stesse icone. Sotto il pollice,
       e sempre nello stesso posto. -->
  <div class="lastra">
    <div class="tra" style="margin-bottom:10px">
      <h2>azioni di attilio</h2>
      <span class="nota">2 rimaste</span>
    </div>
    <div class="azioni">
      <button class="btn pieno"><svg class="ic" aria-hidden="true"><use href="#i-orma"></use></svg>muovi</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-scontro"></use></svg>attacca</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-lente"></use></svg>cerca</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-chiave"></use></svg>interagisci</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-fiala"></use></svg>oggetto</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-ora"></use></svg>fine turno</button>
    </div>
  </div>

  <div class="lastra">
    <h2 style="margin-bottom:8px">il giro degli eroi</h2>
    <div class="giro" id="giro"></div>
  </div>

  <div class="barra-azioni griglia">
    <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-cuore"></use></svg>la salute</button>
    <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-scontro"></use></svg>i nemici</button>
  </div>
</div>

<!-- NEL MENU quel che non è «adesso»: la salute, le abilità, gli oggetti del
     gruppo, i nemici in campo, il diario. Come nell'Indagine. -->
<div class="velo" id="velo" hidden></div>
<div class="foglio" id="foglio" hidden>
  <div class="maniglia"></div>
  <div class="menu-titolo">la squadra</div>
  <button class="menu-voce">
    <svg class="ic grande" aria-hidden="true"><use href="#i-cuore"></use></svg>
    <span class="tit">la salute degli eroi<i>nino è a terra</i></span>
    <span class="conto"><b>3</b> in piedi</span></button>
  <button class="menu-voce">
    <svg class="ic grande" aria-hidden="true"><use href="#i-presagio"></use></svg>
    <span class="tit">le abilità<i>«usa» spende una carica, e vale un’azione</i></span>
    <span class="conto"><b>4</b> cariche</span></button>
  <button class="menu-voce">
    <svg class="ic grande" aria-hidden="true"><use href="#i-fiala"></use></svg>
    <span class="tit">oggetti del gruppo</span>
    <span class="conto"><b>3</b> pezzi</span></button>

  <div class="menu-titolo">la notte</div>
  <button class="menu-voce">
    <svg class="ic grande" aria-hidden="true"><use href="#i-scontro"></use></svg>
    <span class="tit">nemici in campo<i>il custode della cera è ancora in piedi</i></span>
    <span class="conto"><b>3</b></span></button>
  <button class="menu-voce segnata">
    <svg class="ic grande" aria-hidden="true"><use href="#i-penna"></use></svg>
    <span class="tit">diario<i>quel che è successo, round per round</i></span>
    <span class="conto"><b>4 nuove</b></span></button>
  <button class="menu-voce">
    <svg class="ic grande" aria-hidden="true"><use href="#i-candela"></use></svg>
    <span class="tit">l’obiettivo della serata</span></button>

  <div class="bottoni" style="margin-top:14px">
    <button class="btn pieno" id="chiudi-menu">tornate alla mappa</button>
  </div>
</div>

<script src="../dati.js"></script>
<script src="pezzi.js"></script>
<script src="pezzi-spedizione.js"></script>
<script src="icone.js"></script>
<script>
  const { S, esc, urlArt } = PEZZI;
  document.getElementById('stanze').innerHTML = PLANCIA.STANZE.map(PLANCIA.stanza).join('');

  // il canto: tre lumi, due accesi. È la stessa lettura dell'ora nell'Indagine
  document.getElementById('canto').innerHTML = Array.from({ length: 3 }, (_, i) =>
    `<span class="lume-punto ${i < S.canto ? 'acceso' : ''}"></span>`).join('');

  const chi = S.party.find((e) => e.attivo) || S.party[0];
  document.getElementById('turno').innerHTML = `
    <img src="${urlArt(chi.art)}" alt="" loading="lazy">
    <span>tocca a te — ${esc(chi.breve)}</span>
    <span class="quante">2 azioni</span>`;

  document.getElementById('giro').innerHTML = S.party.map((e) => `
    <div class="chip-turno ${e.attivo ? 'tocca' : ''} ${e.fatto ? 'fatto' : ''}">
      <img src="${urlArt(e.art)}" alt="" loading="lazy">
      <span class="sc">${esc(e.breve)}</span>
    </div>`).join('');

  const foglio = document.getElementById('foglio'); const velo = document.getElementById('velo');
  const apri = (si) => { foglio.hidden = !si; velo.hidden = !si; };
  document.getElementById('apri-menu').onclick = () => apri(true);
  document.getElementById('chiudi-menu').onclick = () => apri(false);
  velo.onclick = () => apri(false);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') apri(false); });
</script>
</body></html>
