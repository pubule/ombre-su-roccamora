<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notte e nebbia · indagine (2ª passata)</title>
<link rel="stylesheet" href="base.css"><link rel="stylesheet" href="nebbia.css">
<link rel="stylesheet" href="nebbia2.css">
</head><body>
<div class="wrap">
  <a class="torna" href="index.html">← le tre direzioni</a>

  <div class="scena">
    <div class="sfondo" id="sfondo"></div>
    <div class="dentro">
      <span class="occhiello">ci siete · ora 21</span>
      <h1>taverna del ponte rotto</h1>
      <div class="lumi" style="margin-top:10px" id="lumi"></div>
    </div>
  </div>

  <div class="lastra alta">
    <p class="detto" id="detto"></p>
    <p class="nota" style="margin:0"><svg class="ic" aria-hidden="true"><use href="#i-chiave"></use></svg>
      sul banco: una chiave da campanaro</p>
  </div>

  <!-- LE AZIONI IN GRIGLIA: colonne uguali, icona sopra la parola. Con tre tipi
       o con cinque il bottone resta dov'era, e il pollice lo impara. -->
  <div class="lastra">
    <div class="tra" style="margin-bottom:10px">
      <h2>cosa tentate</h2>
      <span class="nota">le cariche sono vostre</span>
    </div>
    <div class="azioni">
      <button class="btn pieno"><svg class="ic" aria-hidden="true"><use href="#i-occhio"></use></svg>osservazione</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-orecchio"></use></svg>testimonianza</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-referto"></use></svg>referto</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-presagio"></use></svg>presagio</button>
      <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-candela"></use></svg>aiuto profano</button>
    </div>
  </div>

  <div class="lastra">
    <div class="tra" style="margin-bottom:8px">
      <h2>chi indaga</h2>
      <div class="bottoni" style="grid-template-columns:1fr"><button class="btn">menu</button></div>
    </div>
    <div class="eroi" id="eroi"></div>
  </div>

  <div class="lastra">
    <h2 style="margin-bottom:8px">stradario</h2>
    <div id="luoghi"></div>
  </div>

  <!-- in fondo restano solo le due cose che chiudono un luogo: uguali di
       larghezza, così non si preme «lasciate il luogo» per sbaglio -->
  <div class="barra-azioni griglia">
    <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-lente"></use></svg>guardate ancora</button>
    <button class="btn"><svg class="ic" aria-hidden="true"><use href="#i-strappo"></use></svg>lasciate il luogo</button>
  </div>
</div>

<script src="../dati.js"></script>
<script src="pezzi.js"></script>
<script src="icone.js"></script>
<script>
  const { S } = PEZZI;
  document.getElementById('sfondo').style.backgroundImage =
    `url('${S.urlArt('Taverna della Chiatta.png')}')`;
  document.getElementById('detto').textContent = PEZZI.DETTO;
  document.getElementById('eroi').innerHTML = PEZZI.eroiChip();
  document.getElementById('luoghi').innerHTML = PEZZI.stradario();
  document.getElementById('lumi').innerHTML = PEZZI.ORE.map((o) =>
    `<span class="lume-punto ${o.spesa ? '' : 'acceso'}"></span>`).join('')
    + '<span class="nota" style="margin-left:6px">tre ore a mezzanotte</span>';
</script>
</body></html>
